<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pilot Telemetry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1d23;
      color: #c8cdd6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #111318;
      border-bottom: 1px solid #2e3340;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #7eb8f7;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3a8f5c;
      flex-shrink: 0;
    }

    #status-dot.stale { background: #8f6b3a; }

    #pilot-count {
      margin-left: auto;
      font-size: 12px;
      color: #666d7a;
    }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Pilot list ─────────────────────────────────────────────────────────── */

    #pilot-list {
      width: 200px;
      flex-shrink: 0;
      background: #111318;
      border-right: 1px solid #2e3340;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .pilot-list-label {
      padding: 10px 12px 6px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #4d5464;
      font-weight: 600;
    }

    .pilot-item {
      padding: 9px 12px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s;
      user-select: none;
    }

    .pilot-item:hover {
      background: #1e2230;
    }

    .pilot-item.selected {
      background: #1e2a3a;
      border-left-color: #7eb8f7;
    }

    .pilot-name {
      font-size: 13px;
      font-weight: 500;
      color: #dde3ee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pilot-status {
      font-size: 11px;
      color: #5a6272;
      margin-top: 2px;
    }

    .pilot-status.in-air { color: #3a8f5c; }
    .pilot-status.dead { color: #e07b6b; }

    #empty-pilots {
      padding: 20px 12px;
      font-size: 12px;
      color: #4d5464;
      font-style: italic;
    }

    /* ── State panel ────────────────────────────────────────────────────────── */

    #state-panel {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    #no-selection {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 13px;
      color: #4d5464;
      font-style: italic;
    }

    .state-section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #4d5464;
      font-weight: 600;
      padding-bottom: 6px;
      border-bottom: 1px solid #2e3340;
      margin-bottom: 8px;
    }

    .kv-grid {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) 1fr;
      gap: 4px 12px;
    }

    .kv-key {
      font-size: 12px;
      color: #7a8394;
    }

    .kv-value {
      font-size: 12px;
      color: #c8cdd6;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }

    .kv-value.highlight { color: #7eb8f7; }
    .kv-value.danger { color: #e07b6b; }
    .kv-value.ok { color: #3a8f5c; }

    .kills-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .kills-table th {
      text-align: left;
      color: #4d5464;
      font-weight: 600;
      padding: 0 6px 4px 0;
      border-bottom: 1px solid #2e3340;
    }

    .kills-table td {
      padding: 3px 6px 3px 0;
      color: #c8cdd6;
      border-bottom: 1px solid #1e2230;
    }

    .kills-table tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 600;
    }

    .badge-air    { background: #1a3a5c; color: #7eb8f7; }
    .badge-ground { background: #2a3320; color: #7abf6a; }
    .badge-ship   { background: #2a2040; color: #a07be0; }
    .badge-other  { background: #2a2a2a; color: #888; }
  </style>
</head>
<body>
  <header>
    <span id="status-dot"></span>
    <h1>Pilot Telemetry</h1>
    <span id="pilot-count"></span>
  </header>
  <div class="layout">
    <div id="pilot-list">
      <div class="pilot-list-label">Active Pilots</div>
      <div id="pilot-list-items"></div>
    </div>
    <div id="state-panel">
      <div id="no-selection">Select a pilot to view telemetry</div>
    </div>
  </div>
  <script src="telemetryRenderFns.js"></script>
  <script src="telemetryRenderer.js"></script>
</body>
</html>
