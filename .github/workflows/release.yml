name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Serialize releases per tag so two runs can't publish to the same tag at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      # Create the draft release up front so electron-builder appends its assets to
      # an existing release instead of racing its parallel uploads and creating
      # duplicate drafts for the same tag.
      - name: Ensure draft release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" \
            || gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --notes ""

      - name: Build and publish
        working-directory: ./app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: npm run release
